<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/main.css" />
    <title>ToDo_App</title>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card todo-card p-4 bg-white">
            <h2 class="text-center mb-4 text-secondary fw-bold">
              قائمة المهام
            </h2>
            <form class="input-group mb-4">
              <input
                type="text"
                id="taskInput"
                class="form-content form-control border-secondary-subtle py-2"
                placeholder="أضف مهمة جديدة..."
                aria-label="Task input"
              />
              <button
                class="btn btn-primary px-4"
                type="submit"
                id="addTaskBtn"
              >
                <i class="bi bi-plus-lg"></i>
              </button>
            </form>

            <ul class="list-group list-group-flush" id="taskList"></ul>

            <div
              class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top text-muted small"
            >
              <span id="taskCount"
                >عدد المهام : <strong class="text-primary">0</strong></span
              >
              <button
                class="btn btn-sm btn-outline-secondary border-0"
                id="clearAllBtn"
              >
                مسح الكل
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./main.js"></script>
  </body>
</html>
